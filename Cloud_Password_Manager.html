
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudVault - Password Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

body {
    background: #f4f7fb;
    color: #172033;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    padding: 25px 18px;
}

.logo {
    text-align: center;
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 35px;
}

.logo span {
    color: #60a5fa;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #cbd5e1;
    padding: 13px 15px;
    margin: 5px 0;
    text-align: left;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
}

.menu button:hover,
.menu button.active {
    background: #2563eb;
    color: white;
}

/* MAIN */

.main {
    margin-left: 240px;
    padding: 30px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 27px;
}

.header p {
    color: #64748b;
    font-size: 13px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 8px 15px;
    border-radius: 30px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.avatar {
    width: 36px;
    height: 36px;
    background: #2563eb;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.stat-icon {
    font-size: 28px;
}

.stat h2 {
    margin-top: 8px;
}

.stat p {
    color: #64748b;
    font-size: 13px;
}

/* SEARCH */

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search input {
    flex: 1;
    border: none;
    background: white;
    padding: 14px 18px;
    border-radius: 10px;
    outline: none;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

/* BUTTON */

.primary {
    border: none;
    background: #2563eb;
    color: white;
    padding: 12px 20px;
    border-radius: 9px;
    cursor: pointer;
}

.primary:hover {
    background: #1d4ed8;
}

/* PASSWORD LIST */

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.password-list {
    background: white;
    padding: 10px 20px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.password-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 5px;
    border-bottom: 1px solid #e5e7eb;
}

.password-card:last-child {
    border-bottom: none;
}

.account-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.site-icon {
    width: 48px;
    height: 48px;
    background: #eff6ff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.account-info h3 {
    font-size: 15px;
}

.account-info p {
    font-size: 12px;
    color: #64748b;
}

.actions {
    display: flex;
    gap: 7px;
}

.actions button {
    border: none;
    padding: 8px 11px;
    border-radius: 7px;
    cursor: pointer;
}

.view {
    background: #dbeafe;
    color: #1d4ed8;
}

.copy {
    background: #dcfce7;
    color: #15803d;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.modal-box {
    width: 440px;
    background: white;
    padding: 28px;
    border-radius: 17px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.modal-box input,
.modal-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
}

.password-input {
    display: flex;
    gap: 8px;
}

.password-input input {
    flex: 1;
}

.password-input button {
    height: 44px;
    border: none;
    background: #e2e8f0;
    padding: 0 12px;
    border-radius: 8px;
    cursor: pointer;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.cancel {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #e2e8f0;
}

/* SECURITY */

.security-box {
    background: white;
    margin-top: 25px;
    padding: 22px;
    border-radius: 15px;
}

.security-bar {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 12px;
}

.security-progress {
    height: 100%;
    width: 75%;
    background: #22c55e;
}

/* RESPONSIVE */

@media(max-width: 850px) {

    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 650px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .password-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        🔐 Cloud<span>Vault</span>
    </div>

    <div class="menu">

        <button class="active" onclick="showAll()">
            🏠 Dashboard
        </button>

        <button onclick="filterCategory('Social')">
            📱 Social Media
        </button>

        <button onclick="filterCategory('Work')">
            💼 Work
        </button>

        <button onclick="filterCategory('Education')">
            🎓 Education
        </button>

        <button onclick="filterCategory('Shopping')">
            🛒 Shopping
        </button>

        <button onclick="openModal()">
            ➕ Add Password
        </button>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="header">

        <div>
            <h1>Cloud Password Manager</h1>
            <p>Manage your credentials securely in one place 🔐</p>
        </div>

        <div class="profile">

            <div class="avatar">C</div>

            <span>Charu</span>

        </div>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-icon">🔑</div>

            <h2 id="totalAccounts">0</h2>

            <p>Saved Accounts</p>

        </div>


        <div class="stat">

            <div class="stat-icon">🟢</div>

            <h2 id="strongCount">0</h2>

            <p>Strong Passwords</p>

        </div>


        <div class="stat">

            <div class="stat-icon">🛡️</div>

            <h2 id="securityScore">75%</h2>

            <p>Security Score</p>

        </div>

    </section>


    <!-- SEARCH -->

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search websites or accounts..."
            onkeyup="searchPasswords()"
        >

        <button class="primary" onclick="openModal()">
            + Add Password
        </button>

    </div>


    <!-- PASSWORD LIST -->

    <div class="section-title">

        <h2>Saved Accounts</h2>

    </div>


    <section class="password-list" id="passwordList"></section>


    <!-- SECURITY -->

    <section class="security-box">

        <h3>🛡️ Password Security</h3>

        <p style="font-size:13px;color:#64748b;margin-top:5px;">
            Keep your passwords strong and unique.
        </p>

        <div class="security-bar">
            <div class="security-progress"></div>
        </div>

    </section>

</main>


<!-- MODAL -->

<div class="modal" id="passwordModal">

    <div class="modal-box">

        <h2>🔐 Add New Password</h2>

        <input
            id="siteName"
            placeholder="Website / App name"
        >

        <input
            id="username"
            placeholder="Username or Email"
        >

        <select id="category">

            <option value="">Select Category</option>

            <option>Social</option>

            <option>Work</option>

            <option>Education</option>

            <option>Shopping</option>

        </select>


        <div class="password-input">

            <input
                id="password"
                type="password"
                placeholder="Password"
            >

            <button onclick="togglePassword()">
                👁️
            </button>

        </div>


        <button
            class="primary"
            style="width:100%;margin-bottom:15px;"
            onclick="generatePassword()">

            🔑 Generate Strong Password

        </button>


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeModal()">

                Cancel

            </button>

            <button
                class="primary"
                onclick="savePassword()">

                Save Password

            </button>

        </div>

    </div>

</div>


<script>

/*
    EDUCATIONAL PROTOTYPE

    Passwords are stored in browser localStorage.
    This is NOT suitable for real credentials.
*/


let passwords = JSON.parse(
    localStorage.getItem("cloudVaultPasswords")
) || [

    {
        site: "GitHub",
        username: "charu@example.com",
        password: "Git@Hub2026!",
        category: "Work"
    },

    {
        site: "Gmail",
        username: "charu@example.com",
        password: "Mail@2026Strong!",
        category: "Social"
    },

    {
        site: "LinkedIn",
        username: "charu@example.com",
        password: "Linked#2026!",
        category: "Work"
    }

];


let visiblePasswords = passwords;


/* DISPLAY */

function displayPasswords(list = passwords) {

    const container =
        document.getElementById("passwordList");

    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:35px;
                color:#64748b;
            ">
                No accounts found 🔍
            </div>
        `;

        updateStats();

        return;
    }


    list.forEach((item) => {

        const realIndex =
            passwords.indexOf(item);

        container.innerHTML += `

            <div class="password-card">

                <div class="account-info">

                    <div class="site-icon">
                        ${getIcon(item.site)}
                    </div>

                    <div>

                        <h3>${escapeHTML(item.site)}</h3>

                        <p>
                            ${escapeHTML(item.username)}
                            • ${item.category}
                        </p>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="view"
                        onclick="viewPassword(${realIndex})">

                        👁️

                    </button>


                    <button
                        class="copy"
                        onclick="copyPassword(${realIndex})">

                        📋

                    </button>


                    <button
                        class="delete"
                        onclick="deletePassword(${realIndex})">

                        🗑️

                    </button>

                </div>

            </div>

        `;

    });


    updateStats();

}


/* ICONS */

function getIcon(site) {

    const name = site.toLowerCase();

    if (name.includes("github")) return "🐙";

    if (name.includes("gmail")) return "📧";

    if (name.includes("google")) return "🔎";

    if (name.includes("linkedin")) return "💼";

    if (name.includes("instagram")) return "📸";

    if (name.includes("amazon")) return "📦";

    if (name.includes("facebook")) return "📘";

    return "🔐";

}


/* ADD PASSWORD */

function openModal() {

    document.getElementById("passwordModal")
        .style.display = "flex";

}


function closeModal() {

    document.getElementById("passwordModal")
        .style.display = "none";

}


/* SAVE */

function savePassword() {

    const site =
        document.getElementById("siteName").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const category =
        document.getElementById("category").value;

    const password =
        document.getElementById("password").value;


    if (!site || !username || !category || !password) {

        alert("Please fill all fields.");

        return;

    }


    passwords.push({

        site: site,

        username: username,

        password: password,

        category: category

    });


    saveToStorage();

    clearForm();

    closeModal();

    displayPasswords();

    alert("Password saved successfully! 🔐");

}


/* DELETE */

function deletePassword(index) {

    if (!confirm("Delete this account?")) return;


    passwords.splice(index, 1);

    saveToStorage();

    displayPasswords();

}


/* VIEW */

function viewPassword(index) {

    alert(
        "Password:\n\n" +
        passwords[index].password +
        "\n\nEducational prototype only."
    );

}


/* COPY */

async function copyPassword(index) {

    const password =
        passwords[index].password;

    try {

        await navigator.clipboard.writeText(password);

        alert("Password copied!");

    } catch {

        alert("Copy is not supported by this browser.");

    }

}


/* SEARCH */

function searchPasswords() {

    const value =
        document.getElementById("searchInput")
        .value
        .toLowerCase();


    visiblePasswords =
        passwords.filter(item =>

            item.site.toLowerCase().includes(value) ||

            item.username.toLowerCase().includes(value) ||

            item.category.toLowerCase().includes(value)

        );


    displayPasswords(visiblePasswords);

}


/* CATEGORY */

function filterCategory(category) {

    document.getElementById("searchInput").value = category;

    visiblePasswords =
        passwords.filter(item =>
            item.category === category
        );

    displayPasswords(visiblePasswords);

}


/* SHOW ALL */

function showAll() {

    document.getElementById("searchInput").value = "";

    displayPasswords(passwords);

}


/* GENERATE PASSWORD */

function generatePassword() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789" +
        "!@#$%^&*()_+";

    let result = "";

    for (let i = 0; i < 16; i++) {

        result +=
            characters.charAt(
                Math.floor(
                    Math.random() * characters.length
                )
            );

    }

    document.getElementById("password").value = result;

}


/* TOGGLE PASSWORD */

function togglePassword() {

    const field =
        document.getElementById("password");

    field.type =
        field.type === "password"
        ? "text"
        : "password";

}


/* STATS */

function updateStats() {

    document.getElementById("totalAccounts")
        .textContent = passwords.length;


    const strong =
        passwords.filter(item =>
            item.password.length >= 10
        ).length;


    document.getElementById("strongCount")
        .textContent = strong;


    let score = 0;

    if (passwords.length > 0) {

        score =
            Math.round(
                (strong / passwords.length) * 100
            );

    }


    document.getElementById("securityScore")
        .textContent = score + "%";

}


/* STORAGE */

function saveToStorage() {

    localStorage.setItem(
        "cloudVaultPasswords",
        JSON.stringify(passwords)
    );

}


/* CLEAR FORM */

function clearForm() {

    document.getElementById("siteName").value = "";

    document.getElementById("username").value = "";

    document.getElementById("category").value = "";

    document.getElementById("password").value = "";

}


/* HTML SAFETY */

function escapeHTML(value) {

    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* INITIALIZE */

displayPasswords();

</script>

</body>
</html>
